<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Link IQ | المنصة التقنية</title>
    <!-- استيراد خطوط احترافية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3a8a; --secondary: #3b82f6; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        /* القسم العلوي */
        header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white; 
            padding: 80px 20px; 
            text-align: center; 
            border-bottom-left-radius: 50px; 
            border-bottom-right-radius: 50px; 
        }
        
        .container { max-width: 1000px; margin: -40px auto 50px; padding: 0 20px; }
        
        /* البطاقة الرئيسية */
        .main-card { 
            background: white; 
            padding: 40px 20px; 
            border-radius: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; 
            margin-bottom: 40px; 
        }
        
        .section-title { font-weight: 900; font-size: 2em; margin-bottom: 40px; color: var(--primary); }
        
        /* شبكة التطبيقات */
        .apps-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; 
        }
        
        .app-card { 
            background: white; 
            border-radius: 25px; 
            padding: 30px; 
            border: 1px solid #e2e8f0; 
            transition: 0.3s; 
            text-align: center; 
            position: relative;
        }
        
        .app-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            border-color: var(--secondary); 
        }
        
        .app-logo { 
            width: 100px; 
            height: 100px; 
            border-radius: 25px; 
            margin-bottom: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .app-name { font-weight: 900; font-size: 1.6em; margin-bottom: 12px; color: var(--primary); }
