<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Link IQ | الحلول الذكية</title>
    <!-- خط القاهرة الاحترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --bg: #f8fafc;
        }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg); 
            color: #1e293b; 
            margin: 0; 
            padding: 0; 
            line-height: 1.6;
        }
        
        /* غلاف متدرج احترافي بدون صور */
        header { 
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; 
            padding: 100px 20px;
            border-bottom-left-radius: 60px;
            border-bottom-right-radius: 60px;
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.2);
        }

        h1 { margin: 0; font-size: 2.8em; font-weight: 900; letter-spacing: -1px; }
        p.tagline { font-size: 1.2em; opacity: 0.9; margin-top: 10px; }

        .content {
            max-width: 600px;
            margin: -60px auto 50px;
            padding: 0 20px;
        }

        .card { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 35px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.05); 
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: #eff6ff;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 2.5em;
        }

        h2 { color: var(--primary); font-size: 1.8em; margin-bottom: 15px; font-weight: 800; }
        .card p { color: #64748b; font-size: 1.1em; }

        .btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary); 
            color: white; 
            padding: 18px 30px; 
            text-decoration: none; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 1.2em;
            margin-top: 35px; 
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.25);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(30, 58, 138, 0.35);
            background: #1e40af;
        }

        .btn svg { margin-left: 10px; }

        footer { 
            margin-top: 20px; 
            padding: 40px 20px; 
            color: #94a3b8; 
            font-size: 0.9em; 
            text-align: center; 
        }
