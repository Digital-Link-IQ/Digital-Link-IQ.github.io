<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق BIL - حاسبة الكهرباء</title>
    <!-- استيراد خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }
        
        /* الهيدر المتدرج */
        .hero {
            background: linear-gradient(135deg, #004e92, #000428);
            color: white;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .hero h1 { font-size: 3rem; font-weight: 900; margin-bottom: 10px; }
        .hero p { font-size: 1.2rem; opacity: 0.8; }

        /* حاوية المحتوى */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .download-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .app-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .download-btn {
            display: inline-block;
            background-color: #0088cc;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            margin-top: 20px;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: #006699;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,136,204,0.4);
        }

        /* فوتر تحت التحديث */
        .footer-update {
            background: #e9ecef;
            padding: 15px;
            text-align: center;
            border-top: 1px solid #dee2e6;
        }

        .update-text {
            color: #dc3545;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* حركة بسيطة للفوتر */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .update-text span { animation: pulse 2s infinite; }
    </style>
</head>
<body>

    <section class="hero">
        <h1>BIL APP</h1>
        <p>المنصة الرسمية لتطبيق حاسبة الكهرباء في العراق</p>
    </section>

    <main class="main-content">
        <div class="download-card">
            <!-- سيظهر الشعار هنا بعد رفعه باسم logo.png -->
            <img src="assets/images/logo.png" alt="Logo" class="app-icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2807/2807575.png'">
            <h2>حمل التطبيق الآن</h2>
            <p>احصل على أحدث نسخة من تطبيق BIL برابط مباشر وسريع.</p>
            
            <a href="https://github.com/Digital-Link-IQ/BillX/releases/latest/download/Bill.X.apk" class="download-btn">
                تحميل الملف (APK)
            </a>
        </div>
    </main>

    <footer class="footer-update">
        <div class="update-text">
            <span>●</span>
            موقع تطبيق BIL تحت التحديث حالياً لإضافة مميزات جديدة
        </div>
    </footer>

</body>
</html>
